<ul>
    <!-- Affiche tous les articles au fur et à mesure -->
    @for (article of articles; track article) {
    <li>{{article.designation}} : {{article.prix}} €</li>
    }
</ul>

<!-- Appel de notre getter pour afficher le total -->
<p>Total : {{totalPrice}}€</p>

<!-- Signal Forms : on utilise (submit) au lieu de (ngSubmit) -->
<!-- Plus besoin de [formGroup] — le binding est fait via [formField] sur chaque input -->
<form (submit)="addArticle(); $event.preventDefault()">
    <label>
        Désignation :
        <!-- [formField] remplace formControlName : binding bidirectionnel automatique -->
        <input type="text" [formField]="articleForm.designation" />
    </label>
    <label>
        Prix :
        <!-- type="number" + [formField] : conversion string→number automatique -->
        <input type="number" [formField]="articleForm.prix" />
    </label>
    <!-- On oublie pas d'ajouter un bouton submit -->
    <button type="submit">Ajouter</button>
</form>
