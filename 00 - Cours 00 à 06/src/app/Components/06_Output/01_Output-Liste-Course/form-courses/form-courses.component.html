<!-- Le formulaire est quasi identique à celui déjà réalisé dans la démo sur les validators -->
<!-- On a juste enlevé l'affichage, qui sera à la charge du parent -->
<div>
  <!-- Signal Forms : (submit) remplace (ngSubmit), plus de [formGroup] -->
  <form (submit)="onSubmit(); $event.preventDefault()">
      <label> Désignation : </label>
      <!-- [formField] remplace formControlName -->
      <input type="text" [formField]="articleForm.designation" />
      @if (submitted && articleForm.designation().invalid()) {
        <span>
          @for (error of articleForm.designation().errors(); track error) {
            * {{ error.message }}
          }
        </span>
      }
      <label> Prix : </label>
      <input type="number" [formField]="articleForm.prix" />
      @if (submitted && articleForm.prix().invalid()) {
        <span>
          @for (error of articleForm.prix().errors(); track error) {
            * {{ error.message }}
          }
        </span>
      }
    <div>
      <button type="submit">Ajouter</button>
    </div>
  </form>
</div>
